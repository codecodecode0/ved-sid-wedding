# Supabase pauses free projects after a week without activity, which takes RSVPs
# and the guest list offline. A small read twice a week keeps the project awake.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 6 * * 1,4" # Mondays and Thursdays, 06:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" --retry 3 --retry-delay 10 \
            "$SUPABASE_URL/rest/v1/rsvps?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY")
          echo "Supabase answered $status"
          # Fail loudly (GitHub emails the repo owner) if the project is paused or unreachable.
          [ "$status" -lt 500 ] && [ "$status" != "000" ]
