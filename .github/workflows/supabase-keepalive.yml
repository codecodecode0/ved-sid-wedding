# Supabase pauses free projects with low database activity over a week, which takes RSVPs
# and the guest list offline. Their guide suggests a few database requests every day, so
# this runs a real query every four hours. Needs supabase/keepalive.sql to have been run once.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 */4 * * *" # Every four hours, at 17 minutes past
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query the database
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          status=$(curl -s -m 30 -o body.txt -w "%{http_code}" --retry 3 --retry-delay 10 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/keep_awake" \
            -H "apikey: $SUPABASE_KEY" -H "Content-Type: application/json" -d '{}') || true
          echo "Supabase answered $status"
          # Pass only if the query really ran. Anything else (refused, missing, paused)
          # fails the run, and GitHub emails the repo owner.
          [ "$status" = "200" ] && [ "$(cat body.txt)" = "true" ]
